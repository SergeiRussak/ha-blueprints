blueprint:
  name: IKEA BILRESA Matter — Smart Select
  description: >-
    Вариант BILRESA с умным выбором цели. Если нажата уже активная цель,
    она переключается. Если нажата другая уже включённая цель, она только
    выбирается для колёсика. Если цель выключена, она включается и выбирается.
    Длинное нажатие выключает все три набора канала.
  domain: automation

  input:
    remote:
      name: BILRESA пульт
      selector:
        device:
          filter:
            - manufacturer: IKEA of Sweden
              integration: matter

    channel_1_single_targets:
      name: Канал 1 — одинарное нажатие
      description: Лампы и/или умные розетки.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain:
              - light
              - switch
    channel_1_double_targets:
      name: Канал 1 — двойное нажатие
      description: Лампы и/или умные розетки.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain:
              - light
              - switch
    channel_1_triple_targets:
      name: Канал 1 — тройное нажатие
      description: Лампы и/или умные розетки.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain:
              - light
              - switch
    channel_1_last_helper:
      name: Канал 1 — helper последнего выбора
      selector:
        entity:
          filter:
            domain: input_text

    channel_2_single_targets:
      name: Канал 2 — одинарное нажатие
      description: Лампы и/или умные розетки.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain:
              - light
              - switch
    channel_2_double_targets:
      name: Канал 2 — двойное нажатие
      description: Лампы и/или умные розетки.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain:
              - light
              - switch
    channel_2_triple_targets:
      name: Канал 2 — тройное нажатие
      description: Лампы и/или умные розетки.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain:
              - light
              - switch
    channel_2_last_helper:
      name: Канал 2 — helper последнего выбора
      selector:
        entity:
          filter:
            domain: input_text

    channel_3_single_targets:
      name: Канал 3 — одинарное нажатие
      description: Лампы и/или умные розетки.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain:
              - light
              - switch
    channel_3_double_targets:
      name: Канал 3 — двойное нажатие
      description: Лампы и/или умные розетки.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain:
              - light
              - switch
    channel_3_triple_targets:
      name: Канал 3 — тройное нажатие
      description: Лампы и/или умные розетки.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain:
              - light
              - switch
    channel_3_last_helper:
      name: Канал 3 — helper последнего выбора
      selector:
        entity:
          filter:
            domain: input_text

    dim_step_pct:
      name: Шаг яркости
      default: 10
      selector:
        number:
          min: 1
          max: 50
          step: 1
          unit_of_measurement: "%"
          mode: slider

variables:
  ch1_single_targets: !input channel_1_single_targets
  ch1_double_targets: !input channel_1_double_targets
  ch1_triple_targets: !input channel_1_triple_targets
  ch1_last_helper: !input channel_1_last_helper
  ch2_single_targets: !input channel_2_single_targets
  ch2_double_targets: !input channel_2_double_targets
  ch2_triple_targets: !input channel_2_triple_targets
  ch2_last_helper: !input channel_2_last_helper
  ch3_single_targets: !input channel_3_single_targets
  ch3_double_targets: !input channel_3_double_targets
  ch3_triple_targets: !input channel_3_triple_targets
  ch3_last_helper: !input channel_3_last_helper
  dim_step: !input dim_step_pct

trigger_variables:
  remote_device: !input remote
  button_ch1: >-
    {% for item in device_entities(remote_device) %}
      {% set match = item | regex_findall(find='^event[.].+[a-zA-Z]_3.*$') %}
      {% if match | length > 0 %}{{ match[0] }}{% endif %}
    {% endfor %}
  scroll_up_ch1: >-
    {% for item in device_entities(remote_device) %}
      {% set match = item | regex_findall(find='^event[.].+[a-zA-Z]_1.*$') %}
      {% if match | length > 0 %}{{ match[0] }}{% endif %}
    {% endfor %}
  scroll_down_ch1: >-
    {% for item in device_entities(remote_device) %}
      {% set match = item | regex_findall(find='^event[.].+[a-zA-Z]_2.*$') %}
      {% if match | length > 0 %}{{ match[0] }}{% endif %}
    {% endfor %}
  button_ch2: >-
    {% for item in device_entities(remote_device) %}
      {% set match = item | regex_findall(find='^event[.].+[a-zA-Z]_6.*$') %}
      {% if match | length > 0 %}{{ match[0] }}{% endif %}
    {% endfor %}
  scroll_up_ch2: >-
    {% for item in device_entities(remote_device) %}
      {% set match = item | regex_findall(find='^event[.].+[a-zA-Z]_4.*$') %}
      {% if match | length > 0 %}{{ match[0] }}{% endif %}
    {% endfor %}
  scroll_down_ch2: >-
    {% for item in device_entities(remote_device) %}
      {% set match = item | regex_findall(find='^event[.].+[a-zA-Z]_5.*$') %}
      {% if match | length > 0 %}{{ match[0] }}{% endif %}
    {% endfor %}
  button_ch3: >-
    {% for item in device_entities(remote_device) %}
      {% set match = item | regex_findall(find='^event[.].+[a-zA-Z]_9.*$') %}
      {% if match | length > 0 %}{{ match[0] }}{% endif %}
    {% endfor %}
  scroll_up_ch3: >-
    {% for item in device_entities(remote_device) %}
      {% set match = item | regex_findall(find='^event[.].+[a-zA-Z]_7.*$') %}
      {% if match | length > 0 %}{{ match[0] }}{% endif %}
    {% endfor %}
  scroll_down_ch3: >-
    {% for item in device_entities(remote_device) %}
      {% set match = item | regex_findall(find='^event[.].+[a-zA-Z]_8.*$') %}
      {% if match | length > 0 %}{{ match[0] }}{% endif %}
    {% endfor %}

triggers:
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ button_ch1 }}"
    id: button_ch1
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ scroll_up_ch1 }}"
    id: scroll_up_ch1
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ scroll_down_ch1 }}"
    id: scroll_down_ch1
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ button_ch2 }}"
    id: button_ch2
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ scroll_up_ch2 }}"
    id: scroll_up_ch2
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ scroll_down_ch2 }}"
    id: scroll_down_ch2
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ button_ch3 }}"
    id: button_ch3
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ scroll_up_ch3 }}"
    id: scroll_up_ch3
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ scroll_down_ch3 }}"
    id: scroll_down_ch3

conditions:
  - condition: template
    value_template: >-
      {{ trigger.event.data.old_state is not none
         and trigger.event.data.new_state is not none
         and trigger.event.data.old_state.state != 'unavailable'
         and trigger.event.data.new_state.state != 'unavailable' }}

actions:
  - variables:
      event_type: "{{ trigger.event.data.new_state.attributes.event_type | default('', true) }}"
      scroll_clicks: >-
        {{ trigger.event.data.new_state.attributes.totalNumberOfPressesCounted | default(1, true) | int(1) }}

  - variables:
      press_key: >-
        {% if event_type in ['multi_press_1', 'press', 'single_press'] %}single
        {% elif event_type in ['multi_press_2', 'double_press'] %}double
        {% elif event_type in ['multi_press_3', 'triple_press'] %}triple
        {% else %}none{% endif %}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'button_ch1' and press_key != 'none' }}"
        sequence:
          - repeat:
              for_each:
                - key: single
                  targets: !input channel_1_single_targets
                - key: double
                  targets: !input channel_1_double_targets
                - key: triple
                  targets: !input channel_1_triple_targets
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ repeat.item.key == press_key }}"
                  then:
                    - if:
                        - condition: template
                          value_template: "{{ repeat.item.targets | length > 0 }}"
                      then:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ states(ch1_last_helper) == repeat.item.key }}"
                              sequence:
                                - action: homeassistant.toggle
                                  target:
                                    entity_id: "{{ repeat.item.targets | join(',') }}"
                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {% set ns = namespace(on=false) %}
                                    {% for entity in repeat.item.targets %}
                                      {% if is_state(entity, 'on') %}{% set ns.on = true %}{% endif %}
                                    {% endfor %}
                                    {{ ns.on }}
                              sequence:
                                - action: input_text.set_value
                                  target:
                                    entity_id: !input channel_1_last_helper
                                  data:
                                    value: "{{ repeat.item.key }}"
                          default:
                            - action: homeassistant.turn_on
                              target:
                                entity_id: "{{ repeat.item.targets | join(',') }}"
                            - action: input_text.set_value
                              target:
                                entity_id: !input channel_1_last_helper
                              data:
                                value: "{{ repeat.item.key }}"

      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'button_ch2' and press_key != 'none' }}"
        sequence:
          - repeat:
              for_each:
                - key: single
                  targets: !input channel_2_single_targets
                - key: double
                  targets: !input channel_2_double_targets
                - key: triple
                  targets: !input channel_2_triple_targets
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ repeat.item.key == press_key }}"
                  then:
                    - if:
                        - condition: template
                          value_template: "{{ repeat.item.targets | length > 0 }}"
                      then:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ states(ch2_last_helper) == repeat.item.key }}"
                              sequence:
                                - action: homeassistant.toggle
                                  target:
                                    entity_id: "{{ repeat.item.targets | join(',') }}"
                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {% set ns = namespace(on=false) %}
                                    {% for entity in repeat.item.targets %}
                                      {% if is_state(entity, 'on') %}{% set ns.on = true %}{% endif %}
                                    {% endfor %}
                                    {{ ns.on }}
                              sequence:
                                - action: input_text.set_value
                                  target:
                                    entity_id: !input channel_2_last_helper
                                  data:
                                    value: "{{ repeat.item.key }}"
                          default:
                            - action: homeassistant.turn_on
                              target:
                                entity_id: "{{ repeat.item.targets | join(',') }}"
                            - action: input_text.set_value
                              target:
                                entity_id: !input channel_2_last_helper
                              data:
                                value: "{{ repeat.item.key }}"

      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'button_ch3' and press_key != 'none' }}"
        sequence:
          - repeat:
              for_each:
                - key: single
                  targets: !input channel_3_single_targets
                - key: double
                  targets: !input channel_3_double_targets
                - key: triple
                  targets: !input channel_3_triple_targets
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ repeat.item.key == press_key }}"
                  then:
                    - if:
                        - condition: template
                          value_template: "{{ repeat.item.targets | length > 0 }}"
                      then:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ states(ch3_last_helper) == repeat.item.key }}"
                              sequence:
                                - action: homeassistant.toggle
                                  target:
                                    entity_id: "{{ repeat.item.targets | join(',') }}"
                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {% set ns = namespace(on=false) %}
                                    {% for entity in repeat.item.targets %}
                                      {% if is_state(entity, 'on') %}{% set ns.on = true %}{% endif %}
                                    {% endfor %}
                                    {{ ns.on }}
                              sequence:
                                - action: input_text.set_value
                                  target:
                                    entity_id: !input channel_3_last_helper
                                  data:
                                    value: "{{ repeat.item.key }}"
                          default:
                            - action: homeassistant.turn_on
                              target:
                                entity_id: "{{ repeat.item.targets | join(',') }}"
                            - action: input_text.set_value
                              target:
                                entity_id: !input channel_3_last_helper
                              data:
                                value: "{{ repeat.item.key }}"

      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'button_ch1' and event_type in ['long_press', 'hold'] }}"
        sequence:
          - parallel:
              - sequence:
                  - if:
                      - condition: template
                        value_template: "{{ ch1_single_targets | length > 0 }}"
                    then:
                      - action: homeassistant.turn_off
                        target:
                          entity_id: !input channel_1_single_targets
              - sequence:
                  - if:
                      - condition: template
                        value_template: "{{ ch1_double_targets | length > 0 }}"
                    then:
                      - action: homeassistant.turn_off
                        target:
                          entity_id: !input channel_1_double_targets
              - sequence:
                  - if:
                      - condition: template
                        value_template: "{{ ch1_triple_targets | length > 0 }}"
                    then:
                      - action: homeassistant.turn_off
                        target:
                          entity_id: !input channel_1_triple_targets

      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'button_ch2' and event_type in ['long_press', 'hold'] }}"
        sequence:
          - parallel:
              - sequence:
                  - if:
                      - condition: template
                        value_template: "{{ ch2_single_targets | length > 0 }}"
                    then:
                      - action: homeassistant.turn_off
                        target:
                          entity_id: !input channel_2_single_targets
              - sequence:
                  - if:
                      - condition: template
                        value_template: "{{ ch2_double_targets | length > 0 }}"
                    then:
                      - action: homeassistant.turn_off
                        target:
                          entity_id: !input channel_2_double_targets
              - sequence:
                  - if:
                      - condition: template
                        value_template: "{{ ch2_triple_targets | length > 0 }}"
                    then:
                      - action: homeassistant.turn_off
                        target:
                          entity_id: !input channel_2_triple_targets

      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'button_ch3' and event_type in ['long_press', 'hold'] }}"
        sequence:
          - parallel:
              - sequence:
                  - if:
                      - condition: template
                        value_template: "{{ ch3_single_targets | length > 0 }}"
                    then:
                      - action: homeassistant.turn_off
                        target:
                          entity_id: !input channel_3_single_targets
              - sequence:
                  - if:
                      - condition: template
                        value_template: "{{ ch3_double_targets | length > 0 }}"
                    then:
                      - action: homeassistant.turn_off
                        target:
                          entity_id: !input channel_3_double_targets
              - sequence:
                  - if:
                      - condition: template
                        value_template: "{{ ch3_triple_targets | length > 0 }}"
                    then:
                      - action: homeassistant.turn_off
                        target:
                          entity_id: !input channel_3_triple_targets

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'scroll_up_ch1' }}"
        sequence:
          - repeat:
              for_each: >-
                {% if states(ch1_last_helper) == 'single' %}{{ ch1_single_targets }}
                {% elif states(ch1_last_helper) == 'double' %}{{ ch1_double_targets }}
                {% elif states(ch1_last_helper) == 'triple' %}{{ ch1_triple_targets }}
                {% else %}[]{% endif %}
              sequence:
                - condition: template
                  value_template: "{{ repeat.item.startswith('light.') and is_state(repeat.item, 'on') }}"
                - action: light.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    brightness_step_pct: "{{ dim_step * scroll_clicks }}"
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'scroll_down_ch1' }}"
        sequence:
          - repeat:
              for_each: >-
                {% if states(ch1_last_helper) == 'single' %}{{ ch1_single_targets }}
                {% elif states(ch1_last_helper) == 'double' %}{{ ch1_double_targets }}
                {% elif states(ch1_last_helper) == 'triple' %}{{ ch1_triple_targets }}
                {% else %}[]{% endif %}
              sequence:
                - condition: template
                  value_template: "{{ repeat.item.startswith('light.') and is_state(repeat.item, 'on') }}"
                - action: light.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    brightness_step_pct: "{{ -1 * dim_step * scroll_clicks }}"
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'scroll_up_ch2' }}"
        sequence:
          - repeat:
              for_each: >-
                {% if states(ch2_last_helper) == 'single' %}{{ ch2_single_targets }}
                {% elif states(ch2_last_helper) == 'double' %}{{ ch2_double_targets }}
                {% elif states(ch2_last_helper) == 'triple' %}{{ ch2_triple_targets }}
                {% else %}[]{% endif %}
              sequence:
                - condition: template
                  value_template: "{{ repeat.item.startswith('light.') and is_state(repeat.item, 'on') }}"
                - action: light.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    brightness_step_pct: "{{ dim_step * scroll_clicks }}"
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'scroll_down_ch2' }}"
        sequence:
          - repeat:
              for_each: >-
                {% if states(ch2_last_helper) == 'single' %}{{ ch2_single_targets }}
                {% elif states(ch2_last_helper) == 'double' %}{{ ch2_double_targets }}
                {% elif states(ch2_last_helper) == 'triple' %}{{ ch2_triple_targets }}
                {% else %}[]{% endif %}
              sequence:
                - condition: template
                  value_template: "{{ repeat.item.startswith('light.') and is_state(repeat.item, 'on') }}"
                - action: light.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    brightness_step_pct: "{{ -1 * dim_step * scroll_clicks }}"
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'scroll_up_ch3' }}"
        sequence:
          - repeat:
              for_each: >-
                {% if states(ch3_last_helper) == 'single' %}{{ ch3_single_targets }}
                {% elif states(ch3_last_helper) == 'double' %}{{ ch3_double_targets }}
                {% elif states(ch3_last_helper) == 'triple' %}{{ ch3_triple_targets }}
                {% else %}[]{% endif %}
              sequence:
                - condition: template
                  value_template: "{{ repeat.item.startswith('light.') and is_state(repeat.item, 'on') }}"
                - action: light.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    brightness_step_pct: "{{ dim_step * scroll_clicks }}"
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'scroll_down_ch3' }}"
        sequence:
          - repeat:
              for_each: >-
                {% if states(ch3_last_helper) == 'single' %}{{ ch3_single_targets }}
                {% elif states(ch3_last_helper) == 'double' %}{{ ch3_double_targets }}
                {% elif states(ch3_last_helper) == 'triple' %}{{ ch3_triple_targets }}
                {% else %}[]{% endif %}
              sequence:
                - condition: template
                  value_template: "{{ repeat.item.startswith('light.') and is_state(repeat.item, 'on') }}"
                - action: light.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    brightness_step_pct: "{{ -1 * dim_step * scroll_clicks }}"

mode: parallel
max: 30
max_exceeded: silent
