blueprint:
  name: IKEA STYRBAR Zigbee2MQTT — 4 группы
  description: >-
    Управляет четырьмя группами ламп и/или умных розеток через IKEA STYRBAR,
    подключённый к Zigbee2MQTT. Короткое нажатие переключает группу.
    Длительное нажатие выбирает группу и включает режим изменения яркости.
    В режиме яркости короткие нажатия вверх/вниз меняют яркость ламп,
    а короткие нажатия влево/вправо только выходят из режима.
    Розетки участвуют в переключении, но пропускаются при изменении яркости.
  domain: automation
  homeassistant:
    min_version: 2024.4.0

  input:
    remote_device:
      name: Пульт STYRBAR — MQTT device
      description: >-
        Выберите само MQTT-устройство пульта STYRBAR, например mega-button-2.
        Отдельно добавлять action-триггеры не нужно.
      selector:
        device:
          filter:
            - integration: mqtt

    active_group_helper:
      name: Helper активной группы
      description: >-
        input_text, в котором blueprint хранит активную группу.
        Начальное значение должно быть none.
      selector:
        entity:
          filter:
            - domain: input_text

    last_event_helper:
      name: Helper последнего события
      description: >-
        input_text для защиты от повторного on после удержания кнопки.
        Начальное значение должно быть {}.
      selector:
        entity:
          filter:
            - domain: input_text

    up_targets:
      name: Группа ▲
      description: Лампы и/или умные розетки для верхней кнопки.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
            - domain: switch

    down_targets:
      name: Группа ▼
      description: Лампы и/или умные розетки для нижней кнопки.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
            - domain: switch

    left_targets:
      name: Группа ◀
      description: Лампы и/или умные розетки для левой кнопки.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
            - domain: switch

    right_targets:
      name: Группа ▶
      description: Лампы и/или умные розетки для правой кнопки.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
            - domain: switch

    dim_step_pct:
      name: Шаг изменения яркости
      description: Изменение яркости при коротком нажатии ▲ или ▼.
      default: 10
      selector:
        number:
          min: 1
          max: 50
          step: 1
          unit_of_measurement: "%"
          mode: slider

    hold_guard_ms:
      name: Защита после удержания
      description: >-
        Время, в течение которого возможное повторное событие on/off после
        удержания игнорируется.
      default: 1000
      selector:
        number:
          min: 300
          max: 3000
          step: 50
          unit_of_measurement: ms
          mode: slider

variables:
  active_group_helper: !input active_group_helper
  last_event_helper: !input last_event_helper
  dim_step: !input dim_step_pct
  hold_guard_ms: !input hold_guard_ms
  group_targets:
    up: !input up_targets
    down: !input down_targets
    left: !input left_targets
    right: !input right_targets

triggers:
  - trigger: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: on
    id: up_short
  - trigger: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: off
    id: down_short
  - trigger: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: arrow_left_click
    id: left_short
  - trigger: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: arrow_right_click
    id: right_short
  - trigger: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: brightness_move_up
    id: up_hold
  - trigger: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: brightness_move_down
    id: down_hold
  - trigger: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: arrow_left_hold
    id: left_hold
  - trigger: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: arrow_right_hold
    id: right_hold

conditions:
  - condition: template
    value_template: >-
      {{ trigger.id in [
        'up_short', 'down_short', 'left_short', 'right_short',
        'up_hold', 'down_hold', 'left_hold', 'right_hold'
      ] }}

actions:
  - variables:
      button: >-
        {% if trigger.id in ['up_short', 'up_hold'] %}up
        {% elif trigger.id in ['down_short', 'down_hold'] %}down
        {% elif trigger.id in ['left_short', 'left_hold'] %}left
        {% elif trigger.id in ['right_short', 'right_hold'] %}right
        {% else %}none{% endif %}
      active_group: "{{ states(active_group_helper) }}"
      previous_action: >-
        {%- set raw = states(last_event_helper) -%}
        {%- if raw not in ['', 'unknown', 'unavailable', none] and raw | regex_match('^\\{.*\\}$') -%}
          {{ (raw | from_json).a | default('', true) | trim }}
        {%- else -%}
          {{ '' }}
        {%- endif -%}
      previous_time: >-
        {%- set raw = states(last_event_helper) -%}
        {%- if raw not in ['', 'unknown', 'unavailable', none] and raw | regex_match('^\\{.*\\}$') -%}
          {{ (raw | from_json).t | default(0, true) | float(0) }}
        {%- else -%}
          0
        {%- endif -%}
      previous_age_ms: >-
        {{ (as_timestamp(now()) - (previous_time | float(0))) * 1000 }}

  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id in ['up_hold', 'down_hold', 'left_hold', 'right_hold'] }}
        sequence:
          - action: input_text.set_value
            target:
              entity_id: !input last_event_helper
            data:
              value: "{{ {'a': trigger.id, 'b': button, 't': as_timestamp(now())} | to_json }}"
          - action: input_text.set_value
            target:
              entity_id: !input active_group_helper
            data:
              value: "{{ button }}"

      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id in ['up_short', 'down_short', 'left_short', 'right_short'] }}
        sequence:
          - action: input_text.set_value
            target:
              entity_id: !input last_event_helper
            data:
              value: "{{ {'a': trigger.id, 'b': button, 't': as_timestamp(now())} | to_json }}"

          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ previous_action == button ~ '_hold'
                         and (previous_age_ms | float(0)) >= 0
                         and (previous_age_ms | float(0)) <= (hold_guard_ms | int) }}
                sequence: []

              - conditions:
                  - condition: template
                    value_template: >-
                      {{ active_group in group_targets
                         and button in ['up', 'down'] }}
                sequence:
                  - variables:
                      active_targets: "{{ group_targets[active_group] }}"
                      active_lights: >-
                        {% set ns = namespace(ids=[]) %}
                        {% for entity_id in active_targets %}
                          {% if entity_id.startswith('light.') and is_state(entity_id, 'on') %}
                            {% set ns.ids = ns.ids + [entity_id] %}
                          {% endif %}
                        {% endfor %}
                        {{ ns.ids }}
                  - if:
                      - condition: template
                        value_template: "{{ active_lights | length > 0 }}"
                    then:
                      - parallel:
                          - sequence:
                              - action: light.turn_on
                                target:
                                  entity_id: "{{ active_lights | join(',') }}"
                                data:
                                  brightness_step_pct: >-
                                    {{ dim_step | int if button == 'up' else -1 * (dim_step | int) }}

              - conditions:
                  - condition: template
                    value_template: >-
                      {{ active_group in group_targets
                         and button in ['left', 'right'] }}
                sequence:
                  - action: input_text.set_value
                    target:
                      entity_id: !input active_group_helper
                    data:
                      value: none

            default:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ trigger.id == 'up_short' }}"
                    sequence:
                      - parallel:
                          - sequence:
                              - action: homeassistant.toggle
                                target:
                                  entity_id: !input up_targets
                  - conditions:
                      - condition: template
                        value_template: "{{ trigger.id == 'down_short' }}"
                    sequence:
                      - parallel:
                          - sequence:
                              - action: homeassistant.toggle
                                target:
                                  entity_id: !input down_targets
                  - conditions:
                      - condition: template
                        value_template: "{{ trigger.id == 'left_short' }}"
                    sequence:
                      - parallel:
                          - sequence:
                              - action: homeassistant.toggle
                                target:
                                  entity_id: !input left_targets
                  - conditions:
                      - condition: template
                        value_template: "{{ trigger.id == 'right_short' }}"
                    sequence:
                      - parallel:
                          - sequence:
                              - action: homeassistant.toggle
                                target:
                                  entity_id: !input right_targets

mode: restart
max_exceeded: silent
